<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Examen B1 - Parte 1</title>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; padding: 20px; background-color: #121212; color: #e0e0e0; }
        .container { max-width: 600px; margin: 0 auto; background: #1e1e1e; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.5); }
        h1 { text-align: center; color: #ffffff; }
        .question { margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid #333; }
        .options { list-style: none; padding: 0; }
        .options li { margin: 10px 0; }
        .options label { display: block; padding: 10px; background: #2a2a2a; border-radius: 4px; cursor: pointer; transition: background 0.3s; }
        .options label:hover { background: #3a3a3a; }
        .explanation { margin-top: 10px; padding: 10px; border-radius: 4px; display: none; }
        .correct { background-color: #1b5e20; color: #c8e6c9; border: 1px solid #2e7d32; }
        .incorrect { background-color: #b71c1c; color: #ffcdd2; border: 1px solid #c62828; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Examen B1</h1>
        <div id="questions-container"></div>
    </div>
    <script>
        const questions = [
            {
                "question": "When I was a child, I _____ ride my bike to school every day.",
                "options": ["used to", "am used to", "use to"],
                "answer": "used to",
                "explanation": "'Used to' is the correct form for past habits that no longer happen."
            },
            {
                "question": "'I have a headache,' she said.",
                "options": ["She said that she has a headache.", "She said that she had a headache.", "She said that she has had a headache."],
                "answer": "She said that she had a headache.",
                "explanation": "In reported speech, the present tense 'have' shifts back to the past tense 'had'."
            },
            {
                "question": "If you have a bad cold, you should _____.",
                "options": ["put a bandage.", "take some antibiotics.", "drink plenty of fluids."],
                "answer": "drink plenty of fluids.",
                "explanation": "Drinking fluids is a common and recommended remedy for a cold; antibiotics do not treat viruses."
            },
            {
                "question": "'I didn't go to the doctor yesterday,' he said.",
                "options": ["He said that he didn't go to the doctor yesterday.", "He said that he hadn't gone to the doctor the day before.", "He said that he hasn't gone to the doctor the day before."],
                "answer": "He said that he hadn't gone to the doctor the day before.",
                "explanation": "The past simple 'didn't go' shifts to the past perfect 'hadn't gone', and 'yesterday' becomes 'the day before'."
            },
            {
                "question": "'Where are you going?' she asked.",
                "options": ["She asked where I was going.", "She asked where I am going.", "She asked where was I going."],
                "answer": "She asked where I was going.",
                "explanation": "Reported questions follow a statement word order, shifting the tense back."
            },
            {
                "question": "My brother _____ eat vegetables when he was a kid, but now he loves them.",
                "options": ["didn't use to", "doesn't use to", "didn't used to"],
                "answer": "didn't use to",
                "explanation": "'Didn't use to' is the correct negative form for a past habit."
            },
            {
                "question": "My parents _____ me _____ in a small city.",
                "options": ["take / care of", "bring / up", "wake / up"],
                "answer": "bring / up",
                "explanation": "The phrasal verb 'bring up' means to raise a child."
            },
            {
                "question": "Which word has a silent letter?",
                "options": ["cat", "sign", "jump"],
                "answer": "sign",
                "explanation": "The letter 'g' in 'sign' is silent."
            },
            {
                "question": "'I am feeling weak,' she said.",
                "options": ["She said that she is feeling weak.", "She said that she was feeling weak.", "She said that she has felt weak."],
                "answer": "She said that she was feeling weak.",
                "explanation": "Present continuous 'am feeling' shifts back to past continuous 'was feeling'."
            },
            {
                "question": "She is used to _____ up early every morning.",
                "options": ["wake", "waking", "woke"],
                "answer": "waking",
                "explanation": "'Be used to' is followed by a gerund (verb + -ing)."
            },
            {
                "question": "During the celebration, we usually _____ fireworks.",
                "options": ["set off", "hold", "stand"],
                "answer": "set off",
                "explanation": "'Set off' is the standard collocation for igniting fireworks."
            },
            {
                "question": "'I have a running _____,' she said.",
                "options": ["nose", "ear", "throat"],
                "answer": "nose",
                "explanation": "'Running nose' is the common expression for nasal congestion with mucus."
            },
            {
                "question": "My teacher lets us _____ our phones in the classroom.",
                "options": ["using", "use", "used"],
                "answer": "use",
                "explanation": "The causative verb 'let' is followed by the base form of the verb."
            },
            {
                "question": "I am used to _____ up early.",
                "options": ["get", "getting", "got"],
                "answer": "getting",
                "explanation": "'Be used to' requires the gerund form 'getting'."
            },
            {
                "question": "'Are you feeling better?' she asked.",
                "options": ["She asked if I am feeling better.", "She asked if I was feeling better.", "She asked if were I feeling better."],
                "answer": "She asked if I was feeling better.",
                "explanation": "A yes/no reported question uses 'if' and follows statement word order."
            },
            {
                "question": "'I didn't steal the money,' he said.",
                "options": ["He denied stealing the money.", "He denied to steal the money.", "He denied that he steal the money."],
                "answer": "He denied stealing the money.",
                "explanation": "The reporting verb 'deny' is followed by the gerund form."
            },
            {
                "question": "'Why don't we go to the movies?' she suggested.",
                "options": ["She suggested going to the movies.", "She suggested to go to the movies.", "She suggested that we to go to the movies."],
                "answer": "She suggested going to the movies.",
                "explanation": "The reporting verb 'suggest' is followed by the gerund."
            },
            {
                "question": "'It is better to see the doctor,' he explained.",
                "options": ["He explained that it was better to see the doctor.", "He explained that it has been better to see the doctor.", "He explained that it is better to see the doctor."],
                "answer": "He explained that it was better to see the doctor.",
                "explanation": "The tense backshifts from 'is' to 'was' in reported speech."
            },
            {
                "question": "'How did you feel?' she asked.",
                "options": ["She asked how I felt.", "She asked how did I feel.", "She asked how I had felt."],
                "answer": "She asked how I felt.",
                "explanation": "Reported questions use statement word order, and 'did' is omitted."
            }
        ];

        const container = document.getElementById('questions-container');

        questions.forEach((q, index) => {
            const questionDiv = document.createElement('div');
            questionDiv.className = 'question';
            questionDiv.innerHTML = `
                <p>${index + 1}. ${q.question}</p>
                <ul class="options">
                    ${q.options.map(option => `
                        <li>
                            <label>
                                <input type="radio" name="question-${index}" value="${option}">
                                ${option}
                            </label>
                        </li>
                    `).join('')}
                </ul>
                <div id="explanation-${index}" class="explanation"></div>
            `;
            container.appendChild(questionDiv);
        });

        document.querySelectorAll('input[type="radio"]').forEach(radio => {
            radio.addEventListener('change', function() {
                const name = this.name;
                const index = name.split('-')[1];
                const selectedOption = this.value;
                const explanationDiv = document.getElementById(`explanation-${index}`);
                explanationDiv.style.display = 'block';

                const currentQuestion = questions[index];

                if (selectedOption === currentQuestion.answer) {
                    explanationDiv.className = 'explanation correct';
                    explanationDiv.innerHTML = '<strong>¡Correcto!</strong>';
                } else {
                    explanationDiv.className = 'explanation incorrect';
                    explanationDiv.innerHTML = `<strong>Incorrecto.</strong> ${currentQuestion.explanation}`;
                }

                document.querySelectorAll(`input[name="${name}"]`).forEach(input => {
                    input.disabled = true;
                });
            });
        });
    </script>
</body>
</html>
